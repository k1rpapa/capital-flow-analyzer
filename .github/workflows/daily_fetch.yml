# Daily CapitalFlow Market Fetch Workflow
name: Daily CapitalFlow Market Fetch

on:
  schedule:
    # 日本時間 (JST) 午前06:15 = UTC 21:15 (前日)
    - cron: '15 21 * * *'
    # 予備バックアップ発火: 日本時間 (JST) 午前06:45 = UTC 21:45 (前日)
    - cron: '45 21 * * *'
  workflow_dispatch: # GitHubの画面から手動実行できるボタンも追加

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの自動コミット・プッシュ権限を明示許可

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run market fetch & analysis engine
        run: |
          python fetch_data.py

      - name: Run macro overview fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python fetch_macro.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json history.json macro.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data & history [JST 06:00]" && git push)

  deploy-pages:
    needs: fetch-and-update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
