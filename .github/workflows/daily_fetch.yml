# Daily CapitalFlow Market Fetch Workflow
name: Daily CapitalFlow Market Fetch

on:
  schedule:
    # 日本時間 (JST) 午前6:15 = UTC 21:15 (前日) ※00分の混雑回避
    - cron: '15 21 * * *'
  workflow_dispatch: # GitHubの画面から手動実行できるボタンも追加

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの自動コミット・プッシュ権限を明示許可

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run market fetch & analysis engine
        run: |
          python fetch_data.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json history.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data & history [JST 06:00]" && git push)
